<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ruleta de las emociones | ACAD Comenzar de nuevo</title>

<link rel="icon" href="img/favicon.ico">

<style>
:root{
  --bg:#0f1115;
  --card:#151922;
  --text:#ffffff;
}

*{box-sizing:border-box}

body{
  margin:0;
  background:linear-gradient(180deg,#0f1115,#0b0d12);
  color:var(--text);
  font-family:system-ui,Arial;
  text-align:center;
}

.container{max-width:864px;margin:auto;padding:0 12px 24px;}
.canvas-wrap{background:var(--card);border-radius:24px;padding:8px;}
canvas{display:block;width:100%;height:auto;cursor:grab;touch-action:none;}
canvas.is-rotating{cursor:grabbing;}
#info{margin-top:16px;padding:14px;border-radius:16px;background:var(--card);font-size:clamp(1.2rem,4.5vw,1.5rem);font-weight:700;line-height:1.4;overflow-wrap:anywhere;}

.barra{
  position:sticky;
  bottom:0;
  width:100%;
  display:flex;
  gap:6px;
  padding:10px;
  background:#222;
}

.barra button{
  flex:1;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:4px;
  padding:8px 4px;
  border:none;
  border-radius:14px;
  color:white;
  background:#2a3140;
  font-size:11px;
}

.barra svg{
  width:20px;
  height:20px;
}

.site-link{
  display:inline-flex;
  align-items:center;
  justify-content:center;
  gap:8px;
  min-height:44px;
  margin:16px 12px 0;
  padding:10px 18px;
  border-radius:10px;
  background:#fff;
  color:#151922;
  font-weight:700;
  text-decoration:none;
}

.site-link:hover{background:#e1e8f5;}
.site-link:focus-visible{outline:3px solid #f1c40f;outline-offset:4px;}
.busqueda{display:grid;gap:8px;max-width:480px;margin:16px auto;}
.busqueda input{width:100%;min-height:44px;padding:10px;color:var(--text);background:var(--card);border:1px solid #8792a7;border-radius:8px;font:inherit;}
.opciones{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;margin:12px 0;}
.opciones button{min-height:44px;padding:8px 12px;background:#2a3140;color:#fff;border:1px solid #8792a7;border-radius:8px;cursor:pointer;}
.opciones button:focus-visible,.busqueda input:focus-visible,.barra button:focus-visible{outline:3px solid #f1c40f;outline-offset:3px;}
.barra button{min-height:44px;}
.barra button:disabled{opacity:.65;}

@media (max-width:600px){
  h1{margin:16px 12px 8px;font-size:clamp(1.5rem,6vw,2rem);}
  body > p{margin:0 12px 16px;}
  .barra{padding-bottom:max(10px,env(safe-area-inset-bottom));}
  .barra button{min-width:0;font-size:.75rem;line-height:1.25;}
  .opciones button{flex:1 1 130px;overflow-wrap:anywhere;}
}
</style>
</head>

<body>

<a class="site-link" href="index.html"><span aria-hidden="true">←</span> Volver al sitio de ACAD</a>
<h1>Ruleta de las emociones</h1>
<p>Arrastra la ruleta para girarla. Toca una emoción o búscala por nombre.</p>

<main class="container">
  <div class="busqueda">
    <label for="buscar">Buscar una emoción</label>
    <input id="buscar" type="search" autocomplete="off" aria-controls="opciones">
  </div>
  <div id="info" role="status"></div>
  <div id="opciones" class="opciones" role="group" aria-label="Emociones disponibles"></div>
  <div class="canvas-wrap">
    <canvas aria-hidden="true" id="ruleta" width="840" height="840"></canvas>
  </div>
</main>
<div class="barra">

  <button onclick="home()">
    <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 3l9 8h-3v9h-5v-6H11v6H6v-9H3z"/></svg>
    Inicio
  </button>

  <button id="atras" onclick="volverNivel()" disabled>
    <svg viewBox="0 0 24 24" fill="currentColor"><path d="M15 18l-6-6 6-6"/></svg>
    Atrás
  </button>

  <button id="copiar" onclick="copiarResultado()" disabled>
    <svg viewBox="0 0 24 24" fill="currentColor"><path d="M16 1H4v14h2V3h10V1zm4 4H8v18h12V5z"/></svg>
    Copiar
  </button>

  <button onclick="donar()">
    <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 21s-6-4.35-9-7.5C-1 8 3 3 7.5 6.5 12 3 16.5 6.5 16.5 6.5S20 8 21 13.5C18 16.65 12 21 12 21z"/></svg>
    Séptima tradición
  </button>

</div>

<script>
const canvas = document.getElementById("ruleta");
const ctx = canvas.getContext("2d");
const buscar = document.getElementById("buscar");
const opciones = document.getElementById("opciones");
const info = document.getElementById("info");
const atras = document.getElementById("atras");
const copiar = document.getElementById("copiar");

const data = {
  ira:{ color:"#e74c3c", nivel2:{ Amenazado:["Inseguro","Celoso"], Odioso:["Resentido","Violado"], Desquiciado:["Rabioso","Enfurecido"], Agresivo:["Provocado","Hostil"], Frustrado:["Enfadado","Irritado"], Distante:["Retraído","Sospechoso"]}},
  tristeza:{ color:"#0477ba", nivel2:{ Ansioso:["Anhelante","Abrumado"], Abandonado:["Ignorado","Discriminado"], Desesperado:["Impotente","Vulnerable"], Deprimido:["Inferior","Vacío"], Solitario:["Abandonado","Apartado"], Aburrido:["Apático","Indiferente"]}},
  disgusto:{ color:"#24a44f", nivel2:{ Critico:["Sarcástico","Escéptico"], Desaprobado:["Sentencioso","Aborrecido"], Decepcionado:["Repugnante","Rebelde"], Terrible:["Repulsivo","Detestable"], Evasivo:["Aversivo","Indeciso"], Culpable:["Atormentado","Avergonzado"]}},
  sorpresa:{ color:"#CFCF3E", nivel2:{ Jubiloso:["Liberado","Eufórico"], Efusivo:["Inquieto","Energético"], Asombrado:["Atónito","Pasmado"], Confundido:["Desilusionado","Perplejo"], Interesado:["Entretenido","Curioso"]}},
  felicidad:{ color:"#ef971b", nivel2:{ Optimista:["Inspirado","Receptivo"], Íntimo:["Juguetón","Sensible"], Pacífico:["Esperanzado","Amoroso"], Poderoso:["Provocativo","Valiente"], Aceptado:["Respetado","Realizado"], Orgulloso:["Importante","Confiado"]}},
  miedo:{ color:"#912481", nivel2:{ Asustado:["Espantado","Aterrado"], Inseguro:["Inferior","Pobre"], Sumiso:["Indignado","Insignificante"], Rechazado:["Perturbado","Inadecuado"], Humillado:["Ridiculizado","Irrespetado"], Herido:["Devastado","Apenado"]}}
};

const centro = canvas.width / 2;
const vuelta = 2 * Math.PI;
const origen = -Math.PI / 2;
const radios = [0, 126, 260, 408];
const total = Object.values(data).reduce((suma, grupo) =>
  suma + Object.values(grupo.nivel2).flat().length, 0);
const segmentos = [];
const bases = [];
let posicion = 0;
let seleccionado = null;
let giro = 0;
let gesto = null;

function crearSegmento(nombre, color, inicio, fin, padre = null){
  const segmento = { nombre, color, inicio, fin, padre, hijos: [], nivel: padre ? padre.nivel + 1 : 0 };
  segmentos.push(segmento);
  if(padre) padre.hijos.push(segmento);
  return segmento;
}

Object.entries(data).forEach(([nombre, { color, nivel2 }]) => {
  const ramas = Object.entries(nivel2);
  const cantidad = ramas.reduce((suma, [, emociones]) => suma + emociones.length, 0);
  const base = crearSegmento(nombre[0].toUpperCase() + nombre.slice(1), color, posicion, posicion + cantidad);
  bases.push(base);
  ramas.forEach(([nombreRama, emociones]) => {
    const rama = crearSegmento(nombreRama, color, posicion, posicion + emociones.length, base);
    emociones.forEach(emocion => {
      crearSegmento(emocion, color, posicion, posicion + 1, rama);
      posicion++;
    });
  });
});

function ruta(segmento){
  const pasos = [];
  for(let paso = segmento; paso; paso = paso.padre) pasos.push(paso);
  return pasos;
}

function colorTexto(color){
  return [data.tristeza.color, data.miedo.color].includes(color) ? "#fff" : "#151922";
}

function dibujar(){
  if(!ctx) return;
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  const activos = new Set(ruta(seleccionado));

  segmentos.forEach(segmento => {
    const { color, inicio, fin, nivel, nombre } = segmento;
    const anguloInicial = origen + giro + inicio / total * vuelta;
    const anguloFinal = origen + giro + fin / total * vuelta;
    const interno = radios[nivel];
    const externo = radios[nivel + 1];
    ctx.globalAlpha = !seleccionado || activos.has(segmento) ? 1 : .35;
    ctx.beginPath();
    ctx.arc(centro, centro, externo, anguloInicial, anguloFinal);
    if(interno){
      ctx.arc(centro, centro, interno, anguloFinal, anguloInicial, true);
    } else {
      ctx.lineTo(centro, centro);
    }
    ctx.closePath();
    ctx.fillStyle = color;
    ctx.fill();
    ctx.strokeStyle = "#151922";
    ctx.lineWidth = 2;
    ctx.stroke();

    const medio = (anguloInicial + anguloFinal) / 2;
    const radio = nivel ? (interno + externo) / 2 : 78;
    ctx.save();
    ctx.translate(centro + Math.cos(medio) * radio, centro + Math.sin(medio) * radio);
    if(nivel) ctx.rotate(Math.cos(medio) < 0 ? medio + Math.PI : medio);
    ctx.fillStyle = colorTexto(color);
    ctx.font = nivel ? "bold 17px system-ui" : "bold 19px system-ui";
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";
    ctx.fillText(nombre, 0, 0, nivel ? externo - interno - 14 : 82);
    ctx.restore();
  });
  ctx.globalAlpha = 1;
}

function normalizar(texto){
  return texto.toLocaleLowerCase("es").normalize("NFD").replace(/\p{M}/gu, "");
}

function mostrarOpciones(){
  const filtro = normalizar(buscar.value.trim());
  const coincidencias = filtro
    ? segmentos.filter(segmento => normalizar(segmento.nombre).includes(filtro))
    : seleccionado?.hijos ?? bases;

  const botones = coincidencias.map(segmento => {
    const boton = document.createElement("button");
    boton.type = "button";
    boton.style.backgroundColor = segmento.color;
    boton.style.color = colorTexto(segmento.color);
    boton.textContent = filtro ? ruta(segmento).map(paso => paso.nombre).join(" → ") : segmento.nombre;
    boton.addEventListener("click", () => {
      seleccionar(segmento);
      (opciones.querySelector("button") ?? buscar).focus();
    });
    return boton;
  });
  opciones.replaceChildren(...botones);
  if(filtro && !botones.length) opciones.textContent = "No se encontraron emociones.";
}

function textoRuta(){
  return ruta(seleccionado).map(paso => paso.nombre).join(" → ");
}

function seleccionar(segmento){
  seleccionado = segmento;
  buscar.value = "";
  info.textContent = textoRuta();
  info.style.backgroundColor = segmento?.color ?? "";
  info.style.color = segmento ? colorTexto(segmento.color) : "";
  info.hidden = !segmento;
  atras.disabled = !segmento;
  copiar.disabled = !segmento;
  mostrarOpciones();
  dibujar();
}

function puntoRuleta(event){
  const rect = canvas.getBoundingClientRect();
  const x = (event.clientX - rect.left) * canvas.width / rect.width - centro;
  const y = (event.clientY - rect.top) * canvas.height / rect.height - centro;
  return { distancia: Math.hypot(x, y), angulo: Math.atan2(y, x) };
}

canvas.addEventListener("pointerdown", event => {
  if(gesto || event.button !== 0) return;
  const { distancia, angulo } = puntoRuleta(event);
  if(distancia >= radios.at(-1)) return;
  gesto = {
    id: event.pointerId,
    x: event.clientX,
    y: event.clientY,
    angulo: distancia < 24 ? null : angulo,
    arrastrando: false
  };
  canvas.setPointerCapture(event.pointerId);
});

canvas.addEventListener("pointermove", event => {
  if(gesto?.id !== event.pointerId) return;
  if(!gesto.arrastrando && Math.hypot(event.clientX - gesto.x, event.clientY - gesto.y) < 8) return;
  gesto.arrastrando = true;
  canvas.classList.add("is-rotating");
  const { distancia, angulo } = puntoRuleta(event);
  if(distancia < 24){
    gesto.angulo = null;
    return;
  }
  if(gesto.angulo !== null){
    giro = (giro + angulo - gesto.angulo) % vuelta;
    dibujar();
  }
  gesto.angulo = angulo;
});

function terminarGesto(event){
  if(gesto?.id !== event.pointerId) return;
  const { x, y, arrastrando } = gesto;
  gesto = null;
  canvas.classList.remove("is-rotating");
  if(event.type !== "pointerup" || arrastrando || Math.hypot(event.clientX - x, event.clientY - y) >= 8) return;

  const { distancia, angulo } = puntoRuleta(event);
  const nivel = radios.findIndex(radio => distancia < radio) - 1;
  if(nivel < 0) return;
  const posicionAngular = ((angulo - origen - giro) % vuelta + vuelta) % vuelta / vuelta * total;
  const segmento = segmentos.find(paso => paso.nivel === nivel && posicionAngular >= paso.inicio && posicionAngular < paso.fin);
  if(segmento) seleccionar(segmento);
}

canvas.addEventListener("pointerup", terminarGesto);
canvas.addEventListener("pointercancel", terminarGesto);
canvas.addEventListener("lostpointercapture", terminarGesto);

buscar.addEventListener("input", mostrarOpciones);

function volverNivel(){
  seleccionar(seleccionado?.padre ?? null);
  if(atras.disabled) buscar.focus();
}

async function copiarResultado(){
  const segmento = seleccionado;
  const texto = textoRuta();
  try {
    await navigator.clipboard.writeText("Ruleta de las emociones: " + texto + ". ¿Cómo puedo gestionar mis sentimientos?");
    if(seleccionado === segmento) info.textContent = texto + " · Resultado copiado.";
  } catch {
    if(seleccionado === segmento) info.textContent = texto + " · Puedes seleccionar y copiar el resultado.";
  }
}

function donar(){
  window.location.href = "index.html#septima";
}

function home(){
  seleccionar(null);
  buscar.focus();
}

seleccionar(null);
</script>

</body>
</html>
